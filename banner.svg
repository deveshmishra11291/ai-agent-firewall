<svg width="850" height="380" viewBox="0 0 850 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <linearGradient id="cyanMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff0844" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace; font-weight: 900; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="848" height="378" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Cyber Grid -->
  <path d="M 50 0 V 380 M 150 0 V 380 M 250 0 V 380 M 350 0 V 380 M 450 0 V 380 M 550 0 V 380 M 650 0 V 380 M 750 0 V 380" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <path d="M 0 60 H 850 M 0 120 H 850 M 0 180 H 850 M 0 240 H 850 M 0 300 H 850" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Status Pill -->
  <g transform="translate(305, 36)">
    <rect width="240" height="28" rx="14" fill="#00f2fe" fill-opacity="0.08" stroke="#00f2fe" stroke-opacity="0.3"/>
    <circle cx="20" cy="14" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
    <text x="34" y="18" fill="#00f2fe" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">ZERO-TRUST PERIMETER</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(425, 130)" text-anchor="middle">
    <text y="0" class="title" font-size="52" letter-spacing="-1">
      <tspan fill="#ffffff">ai agent </tspan>
      <tspan fill="url(#fireGrad)" filter="url(#glowRed)">firewall</tspan>
    </text>
  </g>

  <!-- Tagline Subtitle -->
  <text x="425" y="172" text-anchor="middle" fill="#8b949e" font-size="14" font-weight="500" class="sub" letter-spacing="0.2">
    Real-Time Observability &amp; Threat Hunter for Autonomous AI Agents
  </text>

  <!-- Terminal Install Command Card -->
  <g transform="translate(180, 205)">
    <rect width="490" height="52" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    
    <!-- Shell Prompt symbol -->
    <text x="24" y="32" fill="#ff0844" font-size="16" font-weight="800" class="mono">$</text>
    
    <!-- Command Text -->
    <text x="44" y="32" fill="#f0f6fc" font-size="14" font-weight="600" class="mono">
      curl -fsSL https://.../install.sh | bash
    </text>

    <!-- Copy badge -->
    <g transform="translate(435, 14)">
      <rect width="38" height="24" rx="6" fill="#21262d"/>
      <path d="M 12 7 h 8 v 10 h -8 z" fill="none" stroke="#8b949e" stroke-width="1.5"/>
      <path d="M 8 10 h 8 v 10 h -8 z" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
    </g>
  </g>

  <!-- GitHub Stars & Harness Badges -->
  <g transform="translate(425, 292)" text-anchor="middle">
    <!-- Star link box -->
    <rect x="-170" y="-12" width="340" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="0" y="5" fill="#8b949e" font-size="12" class="mono">
      ★ drop a star: <tspan fill="#58a6ff">deveshmishra11291/ai-agent-firewall</tspan> →
    </text>
  </g>

  <!-- Bottom Capability Tags -->
  <g transform="translate(425, 345)" text-anchor="middle" fill="#484f58" font-size="11" font-weight="600" class="mono">
    <text>CLAUDE CODE  •  CURSOR  •  CODEX  •  AIDER  •  39 THREAT RULES  •  WASI SANDBOX</text>
  </g>
</svg>
